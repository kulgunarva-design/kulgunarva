<script>
    // ===== НАСТРОЙКИ =====
    // 🔽 ИСПРАВЛЕННАЯ ССЫЛКА 🔽
    const GOOGLE_SHEET_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSGxfbWHSKP-M_pg_vmih8OH1demukme48YMaTcVQzaHzBoKFdUN4Iv35RvnhyUS6uXo4uE1z1OXrmO/pub?output=csv';

    // ===== МУЛЬТИЯЗЫЧНОСТЬ =====
    const translations = {
        ru: {
            nav_home: 'Главная',
            nav_about: 'О нас',
            nav_gallery: 'Галерея',
            nav_projects: 'Проекты',
            nav_members: 'Членам',
            nav_fishing: 'Рыболовный клуб',
            nav_board: 'Доска объявлений',
            nav_contacts: 'Контакты',
            board_title: 'Доска объявлений',
            board_desc: '🚤 Снять лодку · ⛵ Покататься · 🐟 Купить рыбу · 🛒 Продажа / Покупка',
            board_add_btn: 'Добавить объявление',
            board_empty: 'Объявлений пока нет. Будьте первым!',
            loading: 'Загрузка объявлений...',
            filter_all: 'Все',
            filter_rent: 'Снять',
            filter_offer: 'Покататься',
            filter_fish: 'Рыба',
            filter_sell: 'Продажа',
            footer_nav: 'Навигация',
            footer_association: 'Товарищество',
            footer_contact: 'Контакты',
            footer_tagline: 'место для тех, кто любит воду',
            report_btn: 'Сообщить о проблеме'
        },
        en: {
            nav_home: 'Home',
            nav_about: 'About',
            nav_gallery: 'Gallery',
            nav_projects: 'Projects',
            nav_members: 'For Members',
            nav_fishing: 'Fishing Club',
            nav_board: 'Board',
            nav_contacts: 'Contacts',
            board_title: 'Board',
            board_desc: '🚤 Rent a boat · ⛵ Boat trip · 🐟 Buy fish · 🛒 Sale / Purchase',
            board_add_btn: 'Add listing',
            board_empty: 'No listings yet. Be the first!',
            loading: 'Loading listings...',
            filter_all: 'All',
            filter_rent: 'Rent',
            filter_offer: 'Trip',
            filter_fish: 'Fish',
            filter_sell: 'Sale',
            footer_nav: 'Navigation',
            footer_association: 'Association',
            footer_contact: 'Contacts',
            footer_tagline: 'a place for those who love water',
            report_btn: 'Report a problem'
        },
        et: {
            nav_home: 'Avaleht',
            nav_about: 'Meist',
            nav_gallery: 'Galerii',
            nav_projects: 'Projektid',
            nav_members: 'Liikmetele',
            nav_fishing: 'Kalastusklubi',
            nav_board: 'Kuulutuste tahvel',
            nav_contacts: 'Kontaktid',
            board_title: 'Kuulutuste tahvel',
            board_desc: '🚤 Rentida paat · ⛵ Paadisõit · 🐟 Osta kala · 🛒 Müük / Ost',
            board_add_btn: 'Lisa kuulutus',
            board_empty: 'Kuulutusi veel pole. Ole esimene!',
            loading: 'Kuulutuste laadimine...',
            filter_all: 'Kõik',
            filter_rent: 'Rentida',
            filter_offer: 'Sõit',
            filter_fish: 'Kala',
            filter_sell: 'Müük',
            footer_nav: 'Navigatsioon',
            footer_association: 'Ühistu',
            footer_contact: 'Kontaktid',
            footer_tagline: 'koht neile, kes armastavad vett',
            report_btn: 'Teata probleemist'
        }
    };

    let currentLang = 'ru';

    function setLanguage(lang) {
        currentLang = lang;
        const t = translations[lang];
        document.querySelectorAll('[data-key]').forEach(el => {
            const key = el.getAttribute('data-key');
            if (t[key]) {
                el.textContent = t[key];
            }
        });
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
        });
        document.documentElement.lang = lang;
        localStorage.setItem('preferredLanguage', lang);
    }

    document.addEventListener('DOMContentLoaded', function() {
        const savedLang = localStorage.getItem('preferredLanguage');
        if (savedLang && translations[savedLang]) {
            setLanguage(savedLang);
        } else {
            setLanguage('ru');
        }
    });

    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            setLanguage(btn.getAttribute('data-lang'));
        });
    });

    // ===== ЗАГРУЗКА ОБЪЯВЛЕНИЙ ИЗ GOOGLE ТАБЛИЦЫ =====
    document.addEventListener('DOMContentLoaded', function() {
        loadListings();
    });

    function loadListings() {
        const grid = document.getElementById('listingsGrid');

        // Показываем загрузку
        grid.innerHTML = `
            <div class="loading-spinner">
                <i class="fas fa-spinner"></i>
                <p style="margin-top:12px;" data-key="loading">Загрузка объявлений...</p>
            </div>
        `;

        fetch(GOOGLE_SHEET_CSV)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ошибка: ${response.status}`);
                }
                return response.text();
            })
            .then(csv => {
                const rows = parseCSV(csv);
                if (rows.length < 2) {
                    grid.innerHTML = `<div class="empty-board"><i class="fas fa-inbox"></i> <span data-key="board_empty">Объявлений пока нет. Будьте первым!</span></div>`;
                    return;
                }

                // Парсим заголовки
                const headers = rows[0];
                const data = rows.slice(1);

                // Ищем индексы колонок
                const typeIdx = headers.indexOf('Тип объявления');
                const titleIdx = headers.indexOf('Заголовок');
                const descIdx = headers.indexOf('Описание');
                const dateIdx = headers.indexOf('Дата и время');
                const seatsIdx = headers.indexOf('Места');
                const priceIdx = headers.indexOf('Цена');
                const nameIdx = headers.indexOf('Имя');
                const contactIdx = headers.indexOf('Контакт');
                const statusIdx = headers.indexOf('Статус');

                // Фильтруем только одобренные
                const approved = data.filter(row => {
                    if (statusIdx === -1) return true;
                    return row[statusIdx] && row[statusIdx].trim().toLowerCase() === 'одобрено';
                });

                if (approved.length === 0) {
                    grid.innerHTML = `<div class="empty-board"><i class="fas fa-inbox"></i> <span data-key="board_empty">Объявлений пока нет. Будьте первым!</span></div>`;
                    return;
                }

                const typeMap = {
                    '🚤 Снять лодку': { class: 'rent', label: '🚤 Снять лодку' },
                    '⛵ Покататься': { class: 'offer', label: '⛵ Покататься' },
                    '🐟 Купить рыбу': { class: 'fish', label: '🐟 Купить рыбу' },
                    '🛒 Продажа / Покупка': { class: 'sell', label: '🛒 Продажа' }
                };

                grid.innerHTML = approved.map(row => {
                    const type = row[typeIdx] || '';
                    const info = typeMap[type] || { class: 'rent', label: type };

                    return `
                        <div class="listing-card">
                            <span class="type-badge ${info.class}">${info.label}</span>
                            <span class="status-badge">✅ Актуально</span>
                            <div class="title">${row[titleIdx] || 'Без заголовка'}</div>
                            <div class="details">
                                ${row[dateIdx] ? `<span><i class="fas fa-calendar-alt"></i> ${row[dateIdx]}</span>` : ''}
                                ${row[seatsIdx] ? `<span><i class="fas fa-users"></i> ${row[seatsIdx]}</span>` : ''}
                                ${row[priceIdx] ? `<span><i class="fas fa-euro-sign"></i> ${row[priceIdx]}</span>` : ''}
                            </div>
                            <div class="description">${row[descIdx] || ''}</div>
                            <div class="contact">
                                <span class="name"><i class="fas fa-user" style="color:#38B2AC;"></i> ${row[nameIdx] || 'Аноним'}</span>
                                ${row[contactIdx] ? `<a href="tel:${row[contactIdx]}"><i class="fas fa-phone phone-icon"></i> ${row[contactIdx]}</a>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');

            })
            .catch(error => {
                console.error('Ошибка загрузки:', error);
                grid.innerHTML = `
                    <div class="empty-board">
                        <i class="fas fa-exclamation-triangle" style="color:#E8705A;"></i>
                        <p style="margin-top:12px;">Не удалось загрузить объявления. Проверьте ссылку на Google Таблицу.</p>
                        <p style="font-size:13px; color:#7f8c8d; margin-top:8px;">Ссылка: ${GOOGLE_SHEET_CSV}</p>
                    </div>
                `;
            });
    }

    // ===== ПАРСИНГ CSV =====
    function parseCSV(csv) {
        const lines = csv.split('\n');
        const result = [];
        for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (line === '') continue;
            const row = [];
            let current = '';
            let inQuotes = false;
            for (let j = 0; j < line.length; j++) {
                const char = line[j];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    row.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            row.push(current);
            result.push(row);
        }
        return result;
    }

    // ===== ФИЛЬТРЫ =====
    document.addEventListener('DOMContentLoaded', function() {
        const filterTabs = document.querySelectorAll('#filterTabs .tab');
        let currentFilter = 'all';

        filterTabs.forEach(tab => {
            tab.addEventListener('click', function() {
                filterTabs.forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                // Показываем всё, фильтр пока оставляем как есть
                // (можно добавить фильтрацию на клиенте позже)
                loadListings();
            });
        });
    });
</script>
